# The production stack: one service, behind the server's shared Caddy (vaari-dev/edge).
# CI copies this file to /opt/hexfield and writes .env beside it from deploy/.env.example;
# nothing here is edited on the server. By hand there:
#
#   cd /opt/hexfield && docker compose ps | logs -f | restart
#
# No ports are published: Caddy reaches the server over the shared network as hexfield:8765.
# deploy/deploy.sh (run by CI) lists everything a deploy may touch on the shared server.
name: hexfield

services:
  # Named after the app, not `web`: Compose puts the service name on every network the
  # service joins, and a generic name on the shared one could take another app's traffic.
  hexfield:
    image: ghcr.io/vaari-dev/hexfield:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    # The image runs `hexfield-web --lan --no-browser`; these are added to it.
    command: ["--allow-host", "${HEXFIELD_DOMAIN:?HEXFIELD_DOMAIN is not set}"]
    environment:
      HEXFIELD_HOST_KEY: ${HEXFIELD_HOST_KEY:?HEXFIELD_HOST_KEY is not set}
    volumes:
      # Every saved game, written after each decision.
      - data:/data
    # The server writes only to /data. SIGTERM saves and stops it within a second or two.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          # The bots think on this CPU; one game's turn must not starve the box.
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # The image's check, polled every second until first healthy so `up --wait` returns quickly.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    # On the shared network it answers to `hexfield` (the service name) and nothing generic;
    # the edge's sites/hexfield.caddy proxies to hexfield:8765.
    networks:
      - edge

volumes:
  data:

networks:
  # Created by the edge stack; deploy that first. Locally: `docker network create edge` once.
  edge:
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK is not set}
    external: true
