name: hexfield

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  backup:
    <<: *hardening
    image: ${APP_IMAGE:?APP_IMAGE is not set}
    entrypoint: ["python", "-m", "hexfield.backup", "/data", "/backups"]
    restart: "no"
    network_mode: none
    volumes:
      - data:/data
      - backups:/backups

  # Not `web`: the service name is its name on the shared network, where Caddy finds it.
  hexfield:
    <<: *hardening
    image: ${APP_IMAGE:?APP_IMAGE is not set}
    restart: unless-stopped
    depends_on:
      backup:
        condition: service_completed_successfully
    # Only Caddy can reach the server, so its X-Forwarded-For names the client.
    command: ["--allow-host", "${HEXFIELD_DOMAIN:?HEXFIELD_DOMAIN is not set}", "--accounts", "--behind-proxy"]
    environment:
      HEXFIELD_HOST_KEY: ${HEXFIELD_HOST_KEY:?HEXFIELD_HOST_KEY is not set}
    volumes:
      - data:/data
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          # The bots think on this CPU; one game's turn must not starve the shared box.
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    networks:
      - edge

volumes:
  data:
  backups:

networks:
  # Created by the edge stack (vaari-dev/edge), never by this one.
  edge:
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK is not set}
    external: true
