name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: that could stop a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset on main requires the checks named test, browser and image.
  test:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: oldest
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: python -m pip install -q --group dev
      - run: ruff check --output-format github .
      - run: ruff format --check .
      - name: Tests
        run: printf '%s\n' tests/test_*.py | sed 's#/#.#; s#\.py$##' | xargs -P0 -n1 python -m unittest -f
      - name: Tests on the oldest Python in requires-python
        run: printf '%s\n' tests/test_*.py | sed 's#/#.#; s#\.py$##' | xargs -P0 -n1 "$PYTHON" -m unittest -f
        env:
          PYTHON: ${{ steps.oldest.outputs.python-path }}
      - name: Package
        run: |
          python -m build
          twine check --strict dist/*

  browser:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    env:
      # renovate: datasource=npm depName=playwright
      PLAYWRIGHT_VERSION: 1.65.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Google Chrome has no Linux arm64 build; Playwright's Chromium does.
      - run: |
          npx -y "playwright@$PLAYWRIGHT_VERSION" install chromium
          bin=$(find ~/.cache/ms-playwright -path '*/chromium-*' -type f -name chrome | head -1)
          if ldd "$bin" | grep -q "not found"; then sudo npx -y "playwright@$PLAYWRIGHT_VERSION" install-deps chromium; fi
          echo "CHROME_BIN=$bin" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_js.ClientTests.test_in_a_real_browser tests.test_js.ClientTests.test_accounts_in_a_real_browser
        env:
          HEXFIELD_BROWSER_TESTS: "1"

  image:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: HEXFIELD_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test, with the server's compose file
        run: |
          (umask 077 && cat > .env) <<EOF
          APP_IMAGE=$IMAGE
          DOCKER_NETWORK=edge
          HEXFIELD_DOMAIN=localhost
          HEXFIELD_HOST_KEY=ci-only-0123456789abcdef
          EOF
          docker network create edge
          docker compose up -d --no-build --wait --wait-timeout 60 hexfield || { docker compose logs; exit 1; }
          curl -fs http://127.0.0.1:8765/healthz | grep -qF "\"build\":\"$GITHUB_SHA\""
          curl -fs -o /dev/null http://127.0.0.1:8765/js/art.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/games)" = 403
          curl -fs http://127.0.0.1:8765/api/me | grep -qF '"accounts":true'
          docker compose stop hexfield
          test "$(docker compose ps -a --format '{{.ExitCode}}' hexfield)" = 0
          docker compose run --rm --no-deps --entrypoint ls backup /backups | grep -qE '^hexfield-.*\.tar\.gz$'
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        id: push
        run: |
          docker push --quiet "$IMAGE"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [test, browser, image]
    if: github.ref == 'refs/heads/main'
    environment: oracle-cloud
    concurrency:
      group: deploy-oracle-cloud
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      DEPLOY_DIR: /opt/hexfield
      APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          CONFIG
      # One single-quoted line per key in .env.example, so compose takes each value literally.
      - name: Write .env
        env:
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
          HEXFIELD_DOMAIN: ${{ vars.HEXFIELD_DOMAIN }}
          HEXFIELD_HOST_KEY: ${{ secrets.HEXFIELD_HOST_KEY }}
        run: |
          umask 077
          for k in $(grep -oE '^[A-Z][A-Z0-9_]*' .env.example); do
            v=${!k-}
            if [[ $v == *"'"* || $v == *$'\n'* ]]; then
              echo "::error::$k contains a quote or a newline" >&2
              exit 1
            fi
            printf "%s='%s'\n" "$k" "$v"
          done > .env
          env -i PATH="$PATH" HOME="$HOME" docker compose -f compose.yaml config -q
          if (( ${#HEXFIELD_HOST_KEY} < 16 )); then
            echo "::error::HEXFIELD_HOST_KEY must be at least 16 characters" >&2
            exit 1
          fi
      # The pull ignores any registry login stored on the shared server: another app's
      # expired token there gets "denied" even for this public image.
      - name: Deploy, or bring the previous release back
        run: |
          up='docker compose up -d --no-build --wait hexfield || { docker compose logs --tail=50; exit 1; }'
          ssh server "cd $DEPLOY_DIR && cp compose.yaml compose.yaml.previous && cp .env .env.previous"
          { scp compose.yaml .env "server:$DEPLOY_DIR/" && ssh server "cd $DEPLOY_DIR && docker --config /nonexistent compose pull -q hexfield && chmod 600 .env && $up"; } || {
            ssh server "cd $DEPLOY_DIR && mv compose.yaml.previous compose.yaml && mv .env.previous .env && $up"
            exit 1
          }
          echo "Deployed \`$APP_IMAGE\` to https://${{ vars.HEXFIELD_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
      # Only after a good deploy: a failed one rolls back to the previous image.
      - name: Remove older images
        run: ssh server "docker image ls --filter dangling=false --format '{{.Repository}}:{{.Tag}}' ghcr.io/${{ github.repository }} | grep -vxF '$APP_IMAGE' | xargs -r docker image rm"
