[build-system]
requires = ["setuptools>=84.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hexfield"
dynamic = ["version"]
description = "A hex-board settling and trading game against tough bots, with a built-in coach. Terminal and browser, no dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Puneet Goyal" }]
dependencies = []
keywords = ["board game", "strategy", "ai", "terminal", "coach"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://github.com/vaari-dev/hexfield"
Issues = "https://github.com/vaari-dev/hexfield/issues"
Changelog = "https://github.com/vaari-dev/hexfield/blob/main/CHANGELOG.md"

[project.scripts]
hexfield = "hexfield.cli:main"
hexfield-web = "hexfield.web.server:main"

[tool.setuptools]
packages = ["hexfield", "hexfield.web"]

[tool.setuptools.dynamic]
version = { attr = "hexfield.__version__" }

[tool.setuptools.package-data]
"hexfield.web" = ["static/*", "static/js/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001", "S112",  # a bug in a bot or the coach must never crash a game, so they catch everything
    "PLW1510",  # the tests assert on the return code instead
]
